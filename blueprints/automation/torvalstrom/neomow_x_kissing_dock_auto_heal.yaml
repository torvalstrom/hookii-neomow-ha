blueprint:
  name: Neomow X - Auto-heal failed docking (kissing dock + alarm 514/515/116/516)
  description: >
    Self-healing redock + alarm recovery for **Hookii Neomow X** mowers via
    the native [hookii-neomow-ha
    integration](https://github.com/torvalstrom/hookii-neomow-ha).


    **Why this exists**


    The Neomow X charging contacts are two flat square pads on the mower bottom
    that quickly accumulate dust and oxidation in dry/hot weather. The dock side
    has two spring-loaded "finger" contacts that oxidise over time. Combined,
    this means the mower frequently fails its first dock attempt and either sits
    with `chargeCurrent` flapping around 0 A (kissing the dock but not drawing
    power), or throws docking alarm `514` / `515` / `116` / `516`.


    The earlier Neomow firmware had a built-in self-heal that re-docked
    automatically until contact succeeded. Hookii removed that behaviour in a
    later firmware revision even though it worked well, and the symptom is now
    one of the most common owner complaints.


    **What this blueprint does**


    Two recovery paths using the native integration's button entities:


    - **Path A — explicit alarm:** when the **Problem** binary sensor goes `on`
    and stays on for 60 s AND the alarm code is in the configurable
    docking-related allowlist (default `514`, `515`, `116`, `516`), press the
    **Clear Exception** button (same as tapping "OK to resolve" in the Hookii
    app). Alarms outside the allowlist are deliberately NOT auto-cleared —
    blindly acknowledging e.g. a lift/tilt or blade alarm hides real problems.
    Requires integration v0.3.3+ (the `alarm_code` attribute on the Problem
    sensor).

    - **Path B — kissing dock:** when the mower reports `docked`, battery is
    below the configured threshold AND charge current has been flapping inside
    the [-1, 1] A band for 60 s (sitting on the dock without drawing power),
    press the **Return to Dock** button to issue a recharge command — the mower
    physically backs off and re-attempts docking.


    **Bounded retries with give-up (optional but recommended):** create a
    `counter` helper and select it below. Each heal attempt increments it; once
    it reaches *Max attempts* the blueprint stops retrying and sends ONE
    "gave up — human needed" notification instead of hammering the dock all
    night. The counter resets automatically as soon as the mower charges
    normally again (charge current above 1.5 A for 3 minutes). Attempts are
    also rate-limited to one per *Minimum minutes between attempts*.


    **Stale-data guard:** both paths are skipped while telemetry is stale. When
    the Hookii cloud push pipeline stalls, `battery` and `charge_current` freeze
    — often at `0 %` / `0 A` — which looks identical to a low-battery kissing
    dock. The automation only fires if the battery sensor reported within
    `max_telemetry_age_minutes` (default 15) and reads > 0.


    A 2-minute `time_pattern` safety net re-evaluates conditions, so if the
    first redock attempt also failed (which is common — the contact problem can
    take 2–3 redocks to clear), the automation fires again. This matches the
    manual workflow most owners already use.


    **Prerequisites**

    1. hookii-neomow-ha integration installed and configured.

    2. A push notification service (optional — blueprint works silently without
    one).


    **Tested on:** Neomow X Pro. Should work on any Hookii Neomow X variant.

  domain: automation
  source_url: https://github.com/torvalstrom/hookii-neomow-ha/blob/main/blueprints/automation/torvalstrom/neomow_x_kissing_dock_auto_heal.yaml
  input:
    battery_sensor:
      name: Battery sensor
      description: >-
        The integration's battery percentage sensor for this mower
        (e.g. `sensor.neomow_battery`).
      selector:
        entity:
          domain:
            - sensor
          device_class:
            - battery
          multiple: false

    charge_current_sensor:
      name: Charge current sensor
      description: >-
        The integration's charge-current sensor (e.g.
        `sensor.neomow_charge_current`). Positive when charging, negative
        when discharging, near 0 A when the mower is kissing the dock
        without making electrical contact.
      selector:
        entity:
          domain:
            - sensor
          device_class:
            - current
          multiple: false

    problem_binary_sensor:
      name: Problem binary sensor
      description: >-
        The integration's Problem binary sensor (e.g.
        `binary_sensor.neomow_problem`). Goes `on` whenever the Hookii
        cloud sends a `NOTICE_ALARM` with any `errCode` — including `514`
        / `515` (docking failed), `116` (obstacle at charging station), and
        `516` (not charging at dock). Automatically clears once the mower
        is charging or mowing again.
      selector:
        entity:
          domain:
            - binary_sensor
          device_class:
            - problem
          multiple: false

    recover_alarm_button:
      name: Clear Exception button
      description: >-
        The integration's **Clear Exception** button (e.g.
        `button.neomow_clear_exception`). Pressing it sends the
        `recover_alarm` command to the Hookii cloud — identical to tapping
        "OK to resolve" in the Hookii mobile app.
      selector:
        entity:
          domain:
            - button
          multiple: false

    dock_button:
      name: Return to Dock button
      description: >-
        The integration's **Return to Dock** button (e.g.
        `button.neomow_return_to_dock`). Pressing it sends the mower back
        to the dock — identical to the mobile app's "Recharge" button. Used
        for the kissing-dock recovery (Path B).
      selector:
        entity:
          domain:
            - button
          multiple: false

    mower_entity:
      name: Mower entity (docked-state guard for Path B)
      description: >-
        The integration's **lawn_mower** entity for this mower (e.g.
        `lawn_mower.neomow`). Path B (kissing dock) only fires while this
        entity reports `docked`. Without the guard, a mower MOWING in the
        field satisfies the kissing-dock conditions by accident — charge
        current is always ~0 A away from the dock, and battery naturally
        drops below the threshold mid-job — so the blueprint would send it
        home every 2 minutes (reported by a tester, 2026-07-03). If left
        empty, Path B is disabled and only the alarm path (Path A) runs.
      default: ""
      selector:
        entity:
          filter:
            - domain: lawn_mower
          multiple: false

    battery_threshold:
      name: Battery threshold for kissing-dock path
      description: >-
        Path B (kissing dock) only fires when battery is below this
        percentage AND charge current is flapping near 0 A. 20 % is a safe
        default that catches docking failures before the mower runs flat,
        without triggering on a healthy 90–95 % top-up plateau.
      default: 20
      selector:
        number:
          min: 5
          max: 50
          unit_of_measurement: "%"
          mode: slider
          step: 1

    auto_clear_codes:
      name: Alarm codes to auto-clear (Path A allowlist)
      description: >-
        Comma-separated Hookii `errCode`s that Path A is allowed to clear
        automatically. Keep this to docking-related codes: `514` / `515`
        (docking failed), `116` (obstacle at charging station), `516`
        (docking-related). Do NOT add lift/tilt/blade codes — auto-clearing
        those hides real safety problems.
      default: "514,515,116,516"
      selector:
        text:
          multiline: false

    heal_counter:
      name: Heal-attempt counter (optional, recommended)
      description: >-
        A `counter` helper used to bound retries (Settings → Devices &
        services → Helpers → Create helper → Counter). Every heal attempt
        increments it; at *Max attempts* the blueprint stops and sends one
        "gave up" notification. It resets automatically once the mower
        charges normally (above 1.5 A for 3 minutes). Leave empty for
        unbounded retries (the pre-v2 behaviour).
      default: ""
      selector:
        entity:
          filter:
            - domain: counter
          multiple: false

    max_attempts:
      name: Max attempts before giving up
      description: >-
        Only used when a heal-attempt counter is configured. After this many
        attempts without a successful charge, stop retrying and notify.
      default: 3
      selector:
        number:
          min: 1
          max: 10
          mode: slider
          step: 1

    min_minutes_between_attempts:
      name: Minimum minutes between attempts
      description: >-
        Rate limit between heal attempts, so a redock cycle gets time to
        finish before the next attempt is considered.
      default: 3
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min
          mode: slider
          step: 1

    max_telemetry_age_minutes:
      name: Max telemetry age (stale-data guard)
      description: >-
        Both recovery paths are skipped when the integration has not
        received a fresh STATUS push for this many minutes. When the Hookii
        cloud push pipeline stalls, `battery` freezes — often at `0 %` —
        and `charge_current` freezes near `0 A`, which looks exactly like a
        low-battery kissing dock. Freshness is measured from the battery
        sensor's `last_reported` timestamp. 15 minutes comfortably exceeds
        the normal push cadence.
      default: 15
      selector:
        number:
          min: 3
          max: 120
          unit_of_measurement: min
          mode: slider
          step: 1

    notify_service:
      name: Notification service (optional)
      description: >-
        Service to call when the auto-heal fires (e.g.
        `notify.mobile_app_your_phone`). Leave blank to run silently. The
        notification includes which recovery path fired and the current
        battery / charge-current readings.
      default: ""
      selector:
        text:
          multiline: false

mode: single

trigger:
  - platform: state
    entity_id: !input problem_binary_sensor
    to: "on"
    for:
      seconds: 60
    id: error_trigger

  - platform: numeric_state
    entity_id: !input charge_current_sensor
    above: -1
    below: 1
    for:
      seconds: 60
    id: charge_flap_trigger

  - platform: time_pattern
    minutes: /2
    id: safety_net

  # Success signal: the mower is charging normally again -> reset the
  # heal-attempt counter so the budget is available for the next incident.
  - platform: numeric_state
    entity_id: !input charge_current_sensor
    above: 1.5
    for:
      minutes: 3
    id: charging_ok

variables:
  battery_sensor: !input battery_sensor
  charge_current_sensor: !input charge_current_sensor
  problem_binary_sensor: !input problem_binary_sensor
  recover_alarm_button: !input recover_alarm_button
  dock_button: !input dock_button
  mower_entity: !input mower_entity
  battery_threshold: !input battery_threshold
  auto_clear_codes: !input auto_clear_codes
  heal_counter: !input heal_counter
  max_attempts: !input max_attempts
  min_minutes_between_attempts: !input min_minutes_between_attempts
  max_telemetry_age_minutes: !input max_telemetry_age_minutes
  notify_service: !input notify_service

condition: []

action:
  # Success path first: charging normally -> reset the attempt counter.
  - if:
      - condition: trigger
        id: charging_ok
    then:
      - if:
          - condition: template
            value_template: "{{ heal_counter != '' and (states(heal_counter) | int(0)) > 0 }}"
        then:
          - action: counter.reset
            target:
              entity_id: "{{ heal_counter }}"
      - stop: Charging normally - heal counter reset.

  - variables:
      battery_now: "{{ states(battery_sensor) }}"
      charge_now: "{{ states(charge_current_sensor) }}"
      alarm_code: "{{ state_attr(problem_binary_sensor, 'alarm_code') | string }}"
      clear_codes: >-
        {{ auto_clear_codes.split(',') | map('trim') | reject('eq', '') | list }}
      telemetry_fresh: >-
        {% set b = states[battery_sensor] %}
        {{ b is not none
           and (now() - b.last_reported).total_seconds() < (max_telemetry_age_minutes | int * 60)
           and (states(battery_sensor) | float(-1)) > 0 }}
      # Rate limit on the heal BUTTONS, not on the counter. Gating on the
      # counter meant `heal_counter == ''` (the default) short-circuited this to
      # true, so "Minimum minutes between attempts" was silently ignored by
      # every install that had not created a counter helper - the 2-minute
      # safety net could then press a heal button every 2 minutes indefinitely,
      # with no give-up notification (that is counter-gated too).
      #
      # Read each button's STATE, which for a button entity IS the ISO timestamp
      # of its last press. Do NOT use last_changed here: reloading automations
      # or restarting HA re-creates the entity and resets last_changed to the
      # reload time, so it reports "just pressed" when nothing was pressed
      # (measured: last_changed 48 s after a reload, while the real presses were
      # 8 and 14 days old). as_datetime yields none for unknown/unavailable, so
      # a never-pressed button is rejected and the first attempt is allowed.
      rate_ok: >-
        {% set t = [states(recover_alarm_button), states(dock_button)]
                   | map('as_datetime') | reject('none') | list %}
        {{ not t or (now() - (t | max)).total_seconds()
           >= (min_minutes_between_attempts | int * 60) }}
      heal_worthy_alarm: >-
        {{ is_state(problem_binary_sensor, 'on') and alarm_code in clear_codes }}
      kissing_dock: >-
        {{ mower_entity != ''
           and states(mower_entity) == 'docked'
           and (states(battery_sensor) | float(101)) < (battery_threshold | int)
           and -1 < (states(charge_current_sensor) | float(99)) < 1 }}
      attempts: "{{ states(heal_counter) | int(0) if heal_counter != '' else 0 }}"

  # Guards: stale telemetry looks exactly like a kissing dock; rate limit
  # gives each redock cycle time to finish before the next attempt.
  - if:
      - condition: template
        value_template: >-
          {{ not telemetry_fresh
             or not rate_ok
             or not (heal_worthy_alarm or kissing_dock) }}
    then:
      - stop: Nothing to heal (or guards not satisfied).

  # Bounded retries: at the budget, send ONE give-up notification and stop.
  - if:
      - condition: template
        value_template: "{{ heal_counter != '' and attempts >= (max_attempts | int) }}"
    then:
      - if:
          - condition: template
            value_template: "{{ notify_service != '' and attempts == (max_attempts | int) }}"
        then:
          - action: "{{ notify_service }}"
            data:
              title: Neomow auto-heal GAVE UP
              message: >-
                {{ max_attempts }} heal attempts without a successful charge
                (battery {{ battery_now }}%, charge current {{ charge_now }} A,
                alarm code {{ alarm_code }}). Human needed - check the mower
                and dock contacts. The counter resets automatically once it
                charges normally again.
          - action: counter.increment
            target:
              entity_id: "{{ heal_counter }}"
      - stop: Attempt budget exhausted - waiting for a human or a successful charge.

  # Heal: clear a docking-related alarm, or nudge a kissing dock to redock.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ heal_worthy_alarm }}"
        sequence:
          - action: button.press
            target:
              entity_id: !input recover_alarm_button
      - conditions:
          - condition: template
            value_template: "{{ kissing_dock }}"
        sequence:
          - action: button.press
            target:
              entity_id: !input dock_button

  - if:
      - condition: template
        value_template: "{{ heal_counter != '' }}"
    then:
      - action: counter.increment
        target:
          entity_id: "{{ heal_counter }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ notify_service != '' }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              title: Neomow auto-healed
              message: >-
                {%- if heal_worthy_alarm -%}
                  Cleared alarm {{ alarm_code }} (Clear Exception) at {{ now().strftime('%H:%M') }}
                {%- else -%}
                  Return to Dock issued at {{ now().strftime('%H:%M') }}
                  (battery {{ battery_now }}% + charge current {{ charge_now }} A - kissing dock)
                {%- endif -%}
                {%- if heal_counter != '' %} [attempt {{ attempts + 1 }}/{{ max_attempts }}]{% endif -%}.
